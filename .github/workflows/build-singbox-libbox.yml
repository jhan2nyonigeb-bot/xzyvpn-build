name: Build official sing-box libbox for XzyVpn

# Start this workflow manually from the GitHub Actions page.
# This builds the unmodified official sing-box source at the pinned commit.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android-arm64:
    name: Build Android ARM64 AARs (API 21 and 24)
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Check out official sing-box v1.14.4
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          # Verified upstream release v1.14.4, not a mutable branch.
          ref: c005f35300ce76427dc285481ec5695f5b179cd2
          path: upstream
          persist-credentials: false

      - name: Install OpenJDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Go version required by upstream
        uses: actions/setup-go@v6
        with:
          go-version-file: upstream/go.mod
          cache: true
          cache-dependency-path: upstream/go.sum

      - name: Install Android NDK r28
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${ANDROID_HOME:-}" ]]; then
            echo 'ANDROID_HOME was not provided by the runner.' >&2
            exit 1
          fi
          if command -v sdkmanager >/dev/null 2>&1; then
            sdk_manager="$(command -v sdkmanager)"
          elif [[ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]]; then
            sdk_manager="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          else
            echo 'Android sdkmanager is missing from the runner.' >&2
            exit 1
          fi
          # GitHub-hosted Ubuntu runners normally have Android SDK licenses.
          "$sdk_manager" --sdk_root="$ANDROID_HOME" 'ndk;28.0.13004108'
          test -f "$ANDROID_HOME/licenses/android-sdk-license"
          test -f "$ANDROID_HOME/ndk/28.0.13004108/source.properties"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"

      - name: Build official libbox AARs
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          java --version
          go version
          make lib_install
          go run ./cmd/internal/build_libbox -target android -platform android/arm64

      - name: Verify Android ARM64 native libraries
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          for aar in libbox.aar libbox-legacy.aar; do
            test -s "$aar"
            unzip -Z1 "$aar" > "$aar.entries.txt"
            grep -qx 'classes.jar' "$aar.entries.txt"
            grep -Eq '^jni/arm64-v8a/[^/]+\.so$' "$aar.entries.txt"
            if grep -Eq '^jni/(armeabi-v7a|x86|x86_64)/' "$aar.entries.txt"; then
              echo "Unexpected extra architecture in $aar" >&2
              exit 1
            fi
          done

      - name: Package build artifacts, checksums and license
        shell: bash
        working-directory: upstream
        run: |
          set -euo pipefail
          mkdir -p dist/xzyvpn
          cp libbox.aar dist/xzyvpn/libbox-android24-arm64.aar
          cp libbox-legacy.aar dist/xzyvpn/libbox-legacy-android21-arm64.aar
          cp LICENSE dist/xzyvpn/SING_BOX_LICENSE.txt
          (cd dist/xzyvpn && sha256sum *.aar > SHA256SUMS.txt)

      - name: Upload downloadable AARs
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-v1.14.4-libbox-android-arm64
          path: upstream/dist/xzyvpn/
          if-no-files-found: error
          retention-days: 30
