name: Build official Xray-core libraries for XzyVpn

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  xray-android-arm64:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Download pinned official XTLS libXray source
        uses: actions/checkout@v4
        with:
          repository: XTLS/libXray
          ref: 5a0f7d8d1c28b34afb5727b04b26a10f6dbac7e3
          path: libXray
          persist-credentials: false

      - name: Install Java for the Android JNI header
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install official libXray Go version
        uses: actions/setup-go@v6
        with:
          go-version-file: libXray/go.mod
          cache-dependency-path: libXray/go.sum

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: sdkmanager --install 'ndk;27.2.12479018'

      - name: Build libxraycore.so for Android arm64-v8a
        shell: bash
        run: |
          set -euo pipefail
          output="$GITHUB_WORKSPACE/output/arm64-v8a"
          mkdir -p "$output"
          cc="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          cd libXray
          GOOS=android GOARCH=arm64 CGO_ENABLED=1 CC="$cc" \
            go build -buildmode=c-shared -trimpath -ldflags='-s -w' \
            -o "$output/libxraycore.so" ./cgo_bridge

      - name: Build libxzyxrayjni.so adapter for XzyVpn
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output
          cat > output/xray_jni.c <<'JNI_SOURCE'
          #include <jni.h>
          #include <stddef.h>
          extern char *CGoInvoke(char *requestJSON);
          extern void CGoFree(char *value);
          JNIEXPORT jstring JNICALL
          Java_com_xzy23re_dev_service_NativeXrayBridge_nativeInvoke(JNIEnv *env, jclass type, jstring request) {
              (void)type;
              if (request == NULL) return NULL;
              const char *input = (*env)->GetStringUTFChars(env, request, NULL);
              if (input == NULL) return NULL;
              char *result = CGoInvoke((char *)input);
              (*env)->ReleaseStringUTFChars(env, request, input);
              if (result == NULL) return NULL;
              jstring output = (*env)->NewStringUTF(env, result);
              CGoFree(result);
              return output;
          }
          JNI_SOURCE
          cc="$ANDROID_HOME/ndk/27.2.12479018/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android21-clang"
          "$cc" -shared -fPIC -O2 \
            -I"$JAVA_HOME/include" -I"$JAVA_HOME/include/linux" \
            output/xray_jni.c -Loutput/arm64-v8a -lxraycore \
            -Wl,-soname,libxzyxrayjni.so \
            -o output/arm64-v8a/libxzyxrayjni.so
          test -s output/arm64-v8a/libxraycore.so
          test -s output/arm64-v8a/libxzyxrayjni.so
          cp libXray/LICENSE output/LIBXRAY_LICENSE.txt
          sha256sum output/arm64-v8a/*.so > output/SHA256SUMS.txt

      - name: Upload official Xray Android libraries
        uses: actions/upload-artifact@v4
        with:
          name: xzyvpn-xraycore-v054-arm64
          path: |
            output/arm64-v8a/*.so
            output/LIBXRAY_LICENSE.txt
            output/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
