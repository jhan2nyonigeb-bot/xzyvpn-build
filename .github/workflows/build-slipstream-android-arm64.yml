name: Build Slipstream Android ARM64 Client (Experimental)

# Self-contained native-build workflow; NO XzyVpn Android app source required.
# Fix v2: Cross-compile OpenSSL for Android ARM64, then build only the
# archived slipstream-rust client with cargo-ndk. Installing Ubuntu's
# libssl-dev is not enough for an Android-target openssl-sys crate.
# Upstream protocol compatibility and Android runtime execution still require
# testing on a real phone/server.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  slipstream_client:
    name: Cross-compile Slipstream for Android ARM64
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout publicly available Android Slipstream build scripts
        uses: actions/checkout@v4
        with:
          repository: dnstt-xyz/dnstt_xyz_app
          ref: main
          path: upstream
          submodules: recursive
          fetch-depth: 1
          persist-credentials: false

      - name: Check source and record exact revisions
        shell: bash
        run: |
          set -euo pipefail
          test -f upstream/scripts/build_slipstream_android.sh
          test -f upstream/vendor/slipstream-rust/Cargo.toml
          git -C upstream rev-parse HEAD
          git -C upstream submodule status

      - name: Install native compiler prerequisites
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang llvm binutils \
            pkg-config libssl-dev make perl python3

      - name: Install Android SDK without obsolete tools package
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android NDK r28
        id: ndk
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28

      - name: Install Rust Android ARM64 toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Install cargo-ndk
        shell: bash
        run: cargo install cargo-ndk --locked

      - name: Build OpenSSL for Android ARM64 (not Ubuntu)
        shell: bash
        env:
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
        run: |
          set -euo pipefail
          export PATH="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          # 3.5.10 is mentioned in some security notices but is not present
          # as a published GitHub tag. Use the maintained stable 3.5 branch.
          git clone --depth 1 --branch openssl-3.5 https://github.com/openssl/openssl.git openssl-android-src
          git -C openssl-android-src rev-parse HEAD
          cd openssl-android-src
          ./Configure android-arm64 -D__ANDROID_API__=24 \
            no-shared no-tests \
            --prefix="$GITHUB_WORKSPACE/openssl-arm64" --libdir=lib
          make -j2
          make install_sw
          test -s "$GITHUB_WORKSPACE/openssl-arm64/lib/libssl.a"
          test -s "$GITHUB_WORKSPACE/openssl-arm64/lib/libcrypto.a"
          test -f "$GITHUB_WORKSPACE/openssl-arm64/include/openssl/ssl.h"

      - name: Build only the Slipstream ARM64 client
        shell: bash
        # cargo-ndk calls cargo metadata before forwarding 'build' options;
        # run from the directory containing the workspace Cargo.toml.
        working-directory: upstream/vendor/slipstream-rust
        env:
          ANDROID_NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          ANDROID_NDK_ROOT: ${{ steps.ndk.outputs.ndk-path }}
          NDK_HOME: ${{ steps.ndk.outputs.ndk-path }}
          OPENSSL_DIR: ${{ github.workspace }}/openssl-arm64
          OPENSSL_LIB_DIR: ${{ github.workspace }}/openssl-arm64/lib
          OPENSSL_INCLUDE_DIR: ${{ github.workspace }}/openssl-arm64/include
          OPENSSL_STATIC: '1'
          OPENSSL_ROOT_DIR: ${{ github.workspace }}/openssl-arm64
          CMAKE_PREFIX_PATH: ${{ github.workspace }}/openssl-arm64
          PKG_CONFIG_ALLOW_CROSS: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/openssl-arm64/lib/pkgconfig
          RUSTFLAGS: '-C link-arg=-Wl,-z,max-page-size=16384'
        run: |
          set -euo pipefail
          export PATH="$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin:$PATH"
          test -s "$OPENSSL_LIB_DIR/libssl.a"
          test -f Cargo.toml
          cargo locate-project --message-format plain
          cargo ndk -t arm64-v8a -p 24 build --release --locked \
            -p slipstream-client

      - name: Validate ARM64 client and package license
        shell: bash
        run: |
          set -euo pipefail
          binary=upstream/vendor/slipstream-rust/target/aarch64-linux-android/release/slipstream-client
          test -s "$binary"
          test -f upstream/vendor/slipstream-rust/LICENSE
          mkdir -p dist
          cp "$binary" dist/libslipstream_client.so
          cp upstream/vendor/slipstream-rust/LICENSE dist/SLIPSTREAM_RUST_LICENSE.txt
          file dist/libslipstream_client.so | tee dist/BINARY_INFO.txt
          readelf -h dist/libslipstream_client.so | grep -Eq 'Machine:.*AArch64'
          git -C upstream rev-parse HEAD > dist/ANDROID_BUILD_SOURCE_COMMIT.txt
          git -C upstream submodule status > dist/UPSTREAM_SUBMODULE_COMMITS.txt
          git -C openssl-android-src rev-parse HEAD > dist/OPENSSL_SOURCE_COMMIT.txt
          printf '%s\n' 'Build scripts: https://github.com/dnstt-xyz/dnstt_xyz_app' \
            'Native core: https://github.com/Mygod/slipstream-rust (archived Aug 2026)' \
            'OpenSSL: maintained openssl-3.5 branch, built statically for Android ARM64' \
            'ABI: Android arm64-v8a' \
            'Experimental binary: native build success DOES NOT prove server compatibility or VPN connectivity.' \
            'For real-device operation AndroidManifest must extract native libraries.' > dist/BUILD_NOTES.txt
          (cd dist && sha256sum libslipstream_client.so > SHA256SUMS.txt)

      - name: Upload Slipstream ARM64 client
        uses: actions/upload-artifact@v4
        with:
          name: XzyVpn-Slipstream-Android-ARM64-Experimental
          path: dist/
          if-no-files-found: error
          retention-days: 30
